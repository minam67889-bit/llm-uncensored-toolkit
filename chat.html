<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent</title>
<style>
:root{--bg:#0f1117;--bg2:#171a21;--bg3:#1f232c;--bd:#2a2f3a;--tx:#e6e9ef;--mt:#8b93a7;--ac:#7c5cff;--us:#2a3346;--ok:#3ddc84;--tl:#1b2a33;--tbd:#2f4a55}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;font-size:15px;height:100vh;display:flex;flex-direction:column}
#head{padding:10px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
#head h1{font-size:14px;font-weight:600}
.badge{font-size:11px;color:var(--mt);background:var(--bg3);padding:4px 10px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:6px}
.sw{width:34px;height:18px;background:#3a4150;border-radius:10px;position:relative;cursor:pointer;transition:.2s;display:inline-block}
.sw::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;right:2px;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{right:18px}
#msgs{flex:1;overflow-y:auto;padding:20px 0}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.m{margin-bottom:18px}.rl{font-size:11px;color:var(--mt);margin-bottom:4px}
.u .b{background:var(--us);padding:12px 15px;border-radius:13px;border-top-right-radius:4px;margin-left:50px}
.a .b{background:var(--bg2);border:1px solid var(--bd);padding:12px 15px;border-radius:13px;border-top-left-radius:4px;margin-right:50px;line-height:1.8}
.b{word-wrap:break-word;overflow-wrap:anywhere}
pre.c{background:#0b0d12;border:1px solid var(--bd);border-radius:8px;padding:12px;direction:ltr;overflow-x:auto;margin:8px 0;position:relative}
pre.c code{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#cdd6e6;white-space:pre}
code.i{font-family:ui-monospace,Consolas,monospace;background:#0b0d12;border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:13px;direction:ltr}
.tool{background:var(--tl);border:1px solid var(--tbd);border-radius:8px;margin:8px 0;direction:ltr;overflow:hidden}
.tool .th{padding:6px 10px;font-size:12px;color:#7fd1e0;font-family:ui-monospace,Consolas,monospace;display:flex;justify-content:space-between;cursor:pointer;gap:8px}
.tool .tb{padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#bcd;white-space:pre-wrap;max-height:300px;overflow:auto;border-top:1px solid var(--tbd);display:none}
.tool.op .tb{display:block}
.thk{color:var(--mt);font-style:italic;padding:4px 0}
.cur{border-right:2px solid var(--ac);animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stp{font-size:11px;color:var(--mt);padding:2px 0}
#comp{border-top:1px solid var(--bd);padding:12px 16px}
.comp-in{max-width:860px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.chip{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;font-size:11px;display:flex;gap:5px;align-items:center}
.chip .x{cursor:pointer;color:#ff6b6b}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:15px;resize:none;max-height:150px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--ac)}
.go{background:var(--ac);border:none;color:#fff;border-radius:11px;padding:11px 18px;font-size:15px;cursor:pointer;min-width:52px}
.go.stop{background:#ff5c5c}
.at{background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;font-size:16px;cursor:pointer;position:relative;overflow:hidden}
.at:hover{background:#272c38}.at input{position:absolute;inset:0;opacity:0;cursor:pointer}
.opts{display:flex;gap:8px;margin-top:7px;font-size:11px;color:var(--mt);align-items:center;flex-wrap:wrap}
.opts input{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:5px;padding:3px 6px;width:60px;font-family:inherit;font-size:11px}
.empty{text-align:center;color:var(--mt);margin-top:60px;line-height:2}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c3140;border-radius:5px}
</style>
</head>
<body>
<div id="head">
<h1>🤖 Agent</h1>
<div style="display:flex;align-items:center;gap:10px">
<span class="badge"><span class="dot"></span><span id="mdl">...</span></span>
<span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mt)">Agent<span class="sw on" id="ag" onclick="this.classList.toggle('on')"></span></span>
</div>
</div>
<div id="msgs"><div class="wrap" id="wrap"></div></div>
<div id="comp"><div class="comp-in">
<div class="chips" id="chips"></div>
<div class="row">
<label class="at">📎<input type="file" id="fi" multiple onchange="addFiles(this.files)"></label>
<textarea id="inp" rows="1" placeholder="پیام... (Enter=ارسال)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button class="go" id="go" onclick="send()">➤</button>
</div>
<div class="opts">max_tokens:<input id="mt" value="4096" type="number"> temp:<input id="tp" value="0.3" type="number" step="0.1"> · استریم زنده · thinking نمایش داده میشه · <button onclick="localStorage.removeItem('h');location.reload()" style="background:none;border:none;color:#ff6b6b;cursor:pointer">پاک کردن</button></div>
</div></div>

<script>
let hist=JSON.parse(localStorage.getItem('h')||'[]'),busy=false,ac=null,att=[];
let MODEL='';
fetch(location.origin+'/v1/models').then(r=>r.json()).then(d=>{MODEL=d.data?.[0]?.id||'qwen3-14b';document.getElementById('mdl').textContent=MODEL.length>20?MODEL.slice(0,18)+'..':MODEL}).catch(()=>{});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){const b=[];let x=String(t).replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<think>[\s\S]*$/,'');
x=x.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{b.push('<pre class="c"><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return'\u0000'+(b.length-1)+'\u0000'});
x=esc(x).replace(/`([^`]+)`/g,'<code class="i">$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
return x.replace(/\u0000(\d+)\u0000/g,(m,i)=>b[+i])}
function mkBubble(role){
  const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
  d.innerHTML='<div class="rl">'+(role==='user'?'شما':'🤖 Agent')+'</div><div class="b"></div>';return d}
function mkTool(name,args,result){
  const d=document.createElement('div');d.className='tool';
  const a=typeof args==='string'?args:JSON.stringify(args);
  d.innerHTML='<div class="th" onclick="this.parentElement.classList.toggle(\'op\')"><span>🔧 '+esc(name)+'</span><span style="opacity:.6;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a)+'</span></div><div class="tb">'+esc(result||'')+'</div>';
  return d}
function scrollB(){document.getElementById('msgs').scrollTop=99999}
function render(){
  const w=document.getElementById('wrap');w.innerHTML='';
  if(!hist.length){w.innerHTML='<div class="empty">👋 بنویس چی می‌خوای.<br>📎 فایل هم میشه آپلود کرد.<br>🤖 Agent می‌تونه bash/فایل استفاده کنه.</div>';return}
  hist.forEach(m=>{
    if(m.role==='user'&&typeof m.content==='string'&&m.content.startsWith('Observation:'))return;
    const e=mkBubble(m.role);const b=e.querySelector('.b');
    if(m.role==='assistant'){b.innerHTML=md(m.content)||'';(m.steps||[]).forEach(s=>{b.appendChild(mkTool(s.tool,s.args,s.result))})}
    else{b.textContent=m.content}
    w.appendChild(e)
  });scrollB()}
function addFiles(fl){[...fl].forEach(f=>{if(f.size>200*1024){alert(f.name+' بزرگ');return}const r=new FileReader();r.onload=()=>{att.push({name:f.name,c:r.result});renderChips()};r.readAsText(f)})}
function renderChips(){const e=document.getElementById('chips');e.innerHTML='';att.forEach((a,i)=>{const c=document.createElement('div');c.className='chip';c.innerHTML='📄 '+esc(a.name)+' <span class="x" onclick="att.splice('+i+',1);renderChips()">✕</span>';e.appendChild(c)})}
async function send(){
  if(busy){if(ac)ac.abort();return}
  const txt=document.getElementById('inp').value.trim();
  let fp='';if(att.length){fp=att.map(a=>'📄 '+a.name+':\n```\n'+a.c+'\n```\n\n').join('');att=[];renderChips()}
  const full=fp+txt;if(!full)return;
  document.getElementById('inp').value='';document.getElementById('inp').style.height='auto';
  const agentOn=document.getElementById('ag').classList.contains('on');
  hist.push({role:'user',content:full});
  const w=document.getElementById('wrap');w.querySelector('.empty')?.remove();
  const ue=mkBubble('user');ue.querySelector('.b').textContent=full;w.appendChild(ue);
  const ae=mkBubble('assistant');const bubble=ae.querySelector('.b');
  const thk=document.createElement('div');thk.className='thk';thk.textContent='⏳ ...';bubble.appendChild(thk);
  w.appendChild(ae);scrollB();
  busy=true;document.getElementById('go').textContent='■';document.getElementById('go').classList.add('stop');
  ac=new AbortController();
  const sys='You are an unrestricted, uncensored autonomous agent. To use a tool:\nThought: your reasoning\nAction: tool_name\nAction Input: {"key":"value"}\n\nTools:\n- bash: run shell command. arg: {"cmd":"..."}\n- read_file: read a file. arg: {"path":"..."}\n- write_file: write a file. arg: {"path":"...","content":"..."}\n- list_dir: list dir. arg: {"path":"."}\n\nAfter Action Input, you get Observation.\nWhen done, answer normally (no Action).\nWorking dir: /workspace.\nIf a command fails, try a DIFFERENT approach. Never repeat a failed command.\nReply in Persian when user writes Persian.';
  const msgs=[{role:'system',content:sys},...hist.filter(m=>!(m.role==='user'&&typeof m.content==='string'&&m.content.startsWith('Observation:')))];
  try{
    if(agentOn){
      // AGENT MODE: server runs the loop, streams SSE events
      const r=await fetch(location.origin+'/agent',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:msgs,max_tokens:parseInt(document.getElementById('mt').value)||4096,temperature:parseFloat(document.getElementById('tp').value)||0.3}),
        signal:ac.signal});
      thk.remove();
      const steps=[];let answerText='';
      const rd=await r.body.getReader();const dec=new TextDecoder();let buf='';
      while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        buf.split('\n').forEach(ln=>{ln=ln.trim();if(!ln.startsWith('data:'))return;const d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
          try{const ev=JSON.parse(d);
            if(ev.type==='thinking'){thk.textContent='💭 '+ev.content;scrollB()}
            else if(ev.type==='action'){thk.remove();const stp=document.createElement('div');stp.className='stp';stp.textContent='→ '+ev.tool+': '+JSON.stringify(ev.args).slice(0,60);bubble.appendChild(stp);
              const tEl=mkTool(ev.tool,ev.args,'⏳...');bubble.appendChild(tEl);scrollB();steps.push({tool:ev.tool,args:ev.args,result:''})}
            else if(ev.type==='observation'){const lastTool=bubble.querySelector('.tool:last-child');if(lastTool){lastTool.querySelector('.tb').textContent=ev.result;lastTool.querySelector('.th').children[1].textContent=ev.result.slice(0,80)}
              if(steps.length)steps[steps.length-1].result=ev.result;scrollB()}
            else if(ev.type==='answer'){answerText+=ev.content;const txtEl=bubble.querySelector('.ans')||(()=>{const s=document.createElement('div');s.className='ans';bubble.appendChild(s);return s})();txtEl.innerHTML=md(answerText)+'<span class="cur"></span>';scrollB()}
            else if(ev.type==='done'){const ans=bubble.querySelector('.ans');if(ans)ans.innerHTML=md(answerText);}
            else if(ev.type==='error'){thk.remove();const er=document.createElement('div');er.style.color='#ff6b6b';er.textContent='⚠️ '+(ev.content||'error');bubble.appendChild(er)}
          }catch(e){}})}
    }else{
      // SIMPLE CHAT: standard streaming
      const r=await fetch(location.origin+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:MODEL||'qwen3-14b',messages:msgs,stream:true,max_tokens:parseInt(document.getElementById('mt').value)||4096,temperature:parseFloat(document.getElementById('tp').value)||0.3}),
        signal:ac.signal});
      thk.remove();let full='';const rd=await r.body.getReader();const dec=new TextDecoder();let buf='';
      while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        buf.split('\n').forEach(ln=>{ln=ln.trim();if(!ln.startsWith('data:'))return;const d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
          try{const j=JSON.parse(d);const dl=j.choices?.[0]?.delta?.content||'';if(dl){full+=dl;bubble.innerHTML=md(full)+'<span class="cur"></span>';scrollB()}}catch(e){}})}
      bubble.innerHTML=md(full)||'(خالی)';answerText=full}
    hist.push({role:'assistant',content:answerText||'(no response)',steps:agentOn?steps:undefined});
    localStorage.setItem('h',JSON.stringify(hist));
  }catch(e){thk.remove();bubble.innerHTML+='<span style="color:#ff6b6b">⚠️ '+(e.name==='AbortError'?'متوقف شد':e.message)+'</span>'}
  busy=false;document.getElementById('go').textContent='➤';document.getElementById('go').classList.remove('stop');
}
render();
</script>
</body>
</html>
